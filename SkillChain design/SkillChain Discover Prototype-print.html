<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />

<style>
  html, body { background:#0c0810; margin:0; }
  /* screen preview: stack pages with breathing room */
  .print-page { position:relative; width:1380px; margin:0 auto 40px; background:var(--bg, #15101a);
    border:1px solid #2a2233; overflow:hidden; }
  .print-page .app { min-height:auto; }
  .print-label { position:absolute; top:0; left:0; z-index:90; font-family:'Geist Mono',monospace;
    font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#cbb8d6;
    background:#1a1422; border-bottom-right-radius:6px; padding:6px 12px; border:1px solid #2a2233; border-top:none; border-left:none; }

  /* hero needs a real height to show the grid horizon */
  .print-page .hero { min-height:780px; }

  /* overlays (detail / bundle) are position:fixed in the app — pin them into page flow for print */
  .print-overlay .detail { position:relative; inset:auto; min-height:auto; animation:none; }
  .print-overlay .detail::before { position:absolute; }
  .print-bundle { position:relative; min-height:760px; }
  .print-bundle .scrim { position:absolute; animation:none; }
  .print-bundle .bundle { position:absolute; animation:none; transform:none; box-shadow:none; }

  /* freeze any entrance animations at end-state */
  .print-page *, .print-page *::before, .print-page *::after {
    animation-delay:-99s !important; animation-duration:.001s !important;
    animation-iteration-count:1 !important; animation-fill-mode:both !important;
    animation-play-state:running !important;
  }
  /* hide the tweaks panel everywhere in print copy */
  .om-tweaks-root, [data-tweaks-root], .tweaks-panel { display:none !important; }

  @media print {
    @page { size: landscape; margin: 0.4cm; }
    html, body { background:#fff; }
    .print-page {
      width:auto; margin:0; border:none; break-after:page; break-inside:avoid-page;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .print-page:last-child { break-after:auto; }
    .print-label { display:none; }
    /* keep cards from splitting awkwardly */
    .cell, .featured, .reader, .co-summary, .d-card, .pp-card { break-inside:avoid; }
  }
  /* force color rendering for backgrounds/gradients */
  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
