<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkillChain · Discover — Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<style>
  :root{
    --fraunces:'Fraunces', Georgia, serif;
    --geist:'Geist', system-ui, sans-serif;
    --geistmono:'Geist Mono', ui-monospace, monospace;
  }
  html,body{margin:0;height:100%;background:#f0eee9;}
  *{ -webkit-font-smoothing:antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="lib/data.js"></script>
<script type="text/babel" src="variants/v1-broadsheet.jsx"></script>
<script type="text/babel" src="variants/v2-index.jsx"></script>
<script type="text/babel" src="variants/v3-spotlight.jsx"></script>
<script type="text/babel" src="variants/v4-gallery.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="react">
  const B = window.SC_BLOCKS;
  const W = 1280, H = 900;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="discover" title="SkillChain · Discover"
          subtitle="Four directions for the Knowledge Blocks showcase — editorial DNA, escalating boldness. Click ⤢ to open any one fullscreen; hover to feel the motion.">
          <DCArtboard id="v1" label="01 · Broadsheet — editorial, asymmetric lead grid" width={W} height={H}>
            <window.V1Broadsheet blocks={B} />
          </DCArtboard>
          <DCArtboard id="v2" label="02 · Index — dense ledger + live preview rail" width={W} height={H}>
            <window.V2Index blocks={B} />
          </DCArtboard>
          <DCArtboard id="v3" label="03 · Spotlight — glass, depth, 3D tilt" width={W} height={H}>
            <window.V3Spotlight blocks={B} />
          </DCArtboard>
          <DCArtboard id="v4" label="04 · Gallery — flip cards, gradient, ticker" width={W} height={H}>
            <window.V4Gallery blocks={B} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
